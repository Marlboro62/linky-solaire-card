name: Contrôle et release

# À chaque push sur main : contrôle de la carte, validation HACS, puis
# création automatique du tag v<CARD_VERSION> et de la release s'ils n'existent
# pas encore. Une version avec un tiret (0.2.0-beta) sort en pré-release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controle:
    name: Contrôle de la carte
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntaxe JavaScript
        run: node --check linky-solaire-card.js
      - name: Version de la carte
        id: v
        run: |
          v=$(grep -oP 'CARD_VERSION = "\K[^"]+' linky-solaire-card.js)
          [ -n "$v" ] || { echo "::error::CARD_VERSION introuvable"; exit 1; }
          echo "Version de la carte : $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  hacs:
    name: Validation HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: brands topics description

  release:
    name: Publication de la release
    needs: controle
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.controle.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Release déjà publiée ?
        id: existe
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v$VERSION existe déjà : rien à publier."
            echo "existe=oui" >> "$GITHUB_OUTPUT"
          fi
      - name: Créer le tag et la release
        if: steps.existe.outputs.existe != 'oui'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Carte Linky Solaire ${{ env.VERSION }}
          files: linky-solaire-card.js
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
